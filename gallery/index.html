<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Spacechase</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#1c1008">
  <meta name="apple-mobile-web-app-title" content="Spacechase">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Every piece from 2023 to now — Spacechase art journey archive.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Marcellus&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/gallery.css">
</head>
<body data-gmode="art">

<div class="page-bg" aria-hidden="true">
  <div class="sb-spine"></div>
  <div class="sb-margin"></div>
</div>
<div class="spotlight" id="spotlight" aria-hidden="true"></div>
<div class="spot-dot" id="spotDot" aria-hidden="true"></div>

<nav class="nav" id="nav">
  <a href="../portfolio/" class="nav__logo">Spacechase</a>
  <div class="nav__links">
    <a href="../portfolio/"   class="nav__link">Portfolio</a>
    <a href="../gallery/" class="nav__link nav__link--active">Gallery</a>
    <a href="../roadmap/" class="nav__link">Roadmap</a>
    <a href="../about/"   class="nav__link">Meet Me</a>
  </div>
</nav>

<nav class="year-nav" id="yearNav">
  <button class="yn-pill active" data-year="y2026">2026</button>
  <button class="yn-pill"        data-year="y2025">2025</button>
  <button class="yn-pill"        data-year="y2024">2024</button>
  <button class="yn-pill"        data-year="y2023">2023</button>
</nav>

<header class="gallery-hero">
  <p class="hero-eyebrow">Art Journey Archive</p>
  <h1 class="hero-title">Every piece.<br><em>From the start.</em></h1>
  <p class="hero-sub">2023 → now &nbsp;·&nbsp; 66 works &nbsp;·&nbsp; all mediums</p>
</header>

<div class="mode-switch" role="tablist" aria-label="What to show">
  <button class="mode-tab active" data-mode="art"   role="tab" aria-selected="true">Artwork</button>
  <button class="mode-tab"        data-mode="study" role="tab" aria-selected="false">Studies &amp; Sketches</button>
  <span class="mode-count" id="modeCount"></span>
</div>

<main class="gallery-main">
<div id="galleryRoot"></div>
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-inner">
    <div class="lb-art" id="lbArt"></div>
    <div class="lb-info">
      <p class="lb-title" id="lbTitle"></p>
      <p class="lb-meta"  id="lbMeta"></p>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer__inner">
    <p class="footer__name">Spacechase</p>
    <p class="footer__tagline">Digital Artist · Always Learning</p>
    <div class="social-links">
      <a href="#" class="social-link" title="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" class="social-link" title="Twitter / X" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="#" class="social-link" title="ArtStation" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 17.723l2.027 3.505h.001a2.424 2.424 0 0 0 2.164 1.333h13.457l-2.792-4.838H0zm24 .025c0-.484-.143-.935-.388-1.314L15.728 2.728a2.424 2.424 0 0 0-2.142-1.289H9.419L21.598 22.54l1.92-3.325c.378-.637.482-.919.482-1.467zm-11.129-3.462L7.428 4.858l-5.444 9.428h10.887z"/></svg>
      </a>
    </div>
    <nav class="footer__nav">
      <a href="../portfolio/">Portfolio</a>
      <a href="../gallery/">Gallery</a>
      <a href="../roadmap/">Roadmap</a>
      <a href="../about/">Meet Me</a>
    </nav>
    <p class="footer__credit">Made with intention · 2024</p>
  </div>
</footer>

<script src="../gallery-data.js"></script>
<script src="../js/gallery.js"></script>
</body>
</html>
